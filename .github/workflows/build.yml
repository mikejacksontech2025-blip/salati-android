name: Build Salati APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon
          else
            GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salati-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
