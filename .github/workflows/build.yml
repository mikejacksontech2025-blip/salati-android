name: Build Salati APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build Salati APK
        run: |
          # البحث التلقائي عن المجلد الذي يحتوي على gradlew والدخول إليه
          GRADLE_FILE=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: gradlew not found anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salati-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
