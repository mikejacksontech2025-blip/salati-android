name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle
        run: |
          # البحث عن مكان ملف gradlew وتفيذه تلقائياً
          GRADLE_PATH=$(find . -name "gradlew" -maxdepth 3)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Gradlew not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
